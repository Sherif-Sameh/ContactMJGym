[project]
name = "contact_gym"
version = "0.0.1"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy >= 2.0",
    "scipy >= 1.17.0",
    "mujoco >= 3.5.0",
    "robot_descriptions == 3.1.0",
    "gymnasium >= 1.2.0",
    "fire",
]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
contact_gym = { path = ".", editable = true }

[tool.pixi.tasks]
fetch-robots = { cmd = "python scripts/fetch_robots.py" }

[tool.pytest.ini_options]
markers = ["unit"]

[tool.pixi.environments]
test = ["test"]
mink = ["mink"]
sb3 = ["sb3", "mink"]

[tool.pixi.feature.test.pypi-dependencies]
pytest = ">=8.4"

[tool.pixi.feature.mink.pypi-dependencies]
mink = ">=1.1.0"

[tool.pixi.feature.sb3.pypi-dependencies]
stable-baselines3 = ">=2.9.0"
tensorboard = ">=2.9.1"
tqdm = "*"
rich = "*"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs/conf.py",
]

line-length = 100
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "D", "TCH", "ANN"]
ignore = ["ANN401", "D", "ANN"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["vc_core"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
suppress-none-returning = true


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
