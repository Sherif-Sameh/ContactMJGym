name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: latest
      
      - name: Set up headless OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev libgl1-mesa-dri
          echo "MUJOCO_GL=egl" >> "$GITHUB_ENV"

      - name: Install test environment
        run: pixi install -e test

      - name: Fetch test data
        run: pixi run -e test fetch-robots

      - name: Run tests
        run: pixi run -e test pytest tests
